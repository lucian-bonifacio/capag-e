                  - cell "Endereço IP" [ref=f2e349]
                  - cell "200.198.239.x" [ref=f2e351]
            - paragraph [ref=f2e353]: "As redes que estiverem utilizando o produto Proxy Server da Microsoft, com o sistema de segurança ativado, deverão proceder da seguinte forma para que a aplicação possa rodar dentro da rede interna (Intranet):"
            - paragraph [ref=f2e354]: 1. Criar um novo protocolo (ReceitanetBX)
            - paragraph [ref=f2e355]: "2. Gerar as seguintes regras de segurança para o novo protocolo (ReceitanetBX) na tela de definição de protocolos:"
            - paragraph [ref=f2e356]: Permitir conexão inicial na porta 3443, tipo TCP com direção externa.
            - paragraph [ref=f2e357]: "PORT: 3443"
            - paragraph [ref=f2e358]: "TYPE: TCP"
            - paragraph [ref=f2e359]: "DIRECTION: OUTBOUND"
            - paragraph [ref=f2e360]: Permitir conexões subsequentes para qualquer porta com direção interna.
            - paragraph [ref=f2e361]: "PORT: 0"
            - paragraph [ref=f2e362]: "TYPE: TCP"
            - paragraph [ref=f2e363]: "DIRECTION: INBOUND"
            - paragraph [ref=f2e364]:
              - generic [ref=f2e365]: 15 - O que fazer pois a mensagem do ReceitanetBX é " Nenhum dos servidores respondeu ao pedido de conexão..." ?
            - paragraph [ref=f2e366]: "R: Verificar se a configuração Proxy/Firewall de sua rede está de acordo com o necessário para permitir a comunicação com os servidores da RFB. Nas configurações de Proxy devem ser liberados todos os pacotes da porta 3443 para as faixas de IP's e 200.198.239.x tanto para entrada quanto para saída (veja item 13)."
            - paragraph [ref=f2e367]: "Se o problema persistir, faça um download da versão mais atualizada do ReceitanetBX e tente novamente. Certifique-se de que foram satisfeitas as seguintes condições:"
            - paragraph [ref=f2e368]: 1. Acesso a Internet está estabelecido.
            - paragraph [ref=f2e369]: Se você se conecta à Internet através de provedor ou rede local verifique se é possível acessar alguma homepage usando o browser (por exemplo www.brasil.gov.br). Se você não consegue acessar nenhum servidor na Internet (inclusive os servidores da RFB), entre em contato com seu provedor de acesso ou suporte da rede local.
            - paragraph [ref=f2e370]: "2. Verifique se a dificuldade de comunicação não é causada pelos seguintes fatores:"
            - paragraph [ref=f2e371]: 1. Se seu acesso a Internet é feito através de servidores Proxy ou Firewall, certifique-se junto ao administrador de rede que estes estão configurados de tal forma a permitir o uso do ReceitanetBX.
            - paragraph [ref=f2e372]: 2. O uso de aceleradores para acesso a Internet (como o caso do Netsonic), podem implicar em falha de comunicação. Caso esteja ocorrendo falhas, tente novamente, desabilitando o acelerador antes de se conectar a Internet.
            - paragraph [ref=f2e373]: "3. O sistema comunicação é desenvolvido para trabalhar sobre a infra-estrutura:"
            - paragraph [ref=f2e374]: a. plataforma Microsoft Windows;
            - paragraph [ref=f2e375]: b. TCP/IP Microsoft (instalado pelo próprio sistema operacional);
            - paragraph [ref=f2e376]: c. acesso direto Internet (seja através de provedor de acesso ou rede local).
            - paragraph [ref=f2e377]: Esteja alerta para a possibilidade de outros programas afetarem a forma como o acesso a Internet é disponibilizado para o ReceitanetBX.
            - paragraph [ref=f2e378]: 4. Restrições impostas por alguns provedores de acesso.
            - paragraph [ref=f2e379]:
              - generic [ref=f2e380]: 16 - O que fazer pois ocorreu falha na comunicação?
            - paragraph [ref=f2e381]: "R: Na comunicação pode ocorrer falhas por vários motivos. Além de certificar-se estar satisfazendo os critérios estabelecidos no documento Conexão a RFB, atente para os fatos abaixo:"
            - paragraph [ref=f2e382]: 1. Se seu acesso a Internet é feito através de servidores Proxy ou Firewall, certifique-se junto ao administrador de rede que estes estão configurados de tal forma a permitir o uso do ReceitanetBX.
            - paragraph [ref=f2e383]: 2. O uso de aceleradores para acesso a Internet (como o caso do Netsonic), podem implicar em falha de comunicação. Caso esteja ocorrendo falhas, tente novamente, desabilitando o acelerador antes de se conectar a Internet.
            - paragraph [ref=f2e384]: "3. O sistema de comunicação é desenvolvido para trabalhar sobre a infra-estrutura:"
            - paragraph [ref=f2e385]: a. plataforma Microsoft Windows;
            - paragraph [ref=f2e386]: b. TCP/IP Microsoft (instalado pelo próprio sistema operacional);
            - paragraph [ref=f2e387]: c. acesso direto Internet (seja através de provedor de acesso ou rede local).
            - paragraph [ref=f2e388]: Esteja alerta para a possibilidade de outros programas afetarem a forma como o acesso a Internet é disponibilizado para o ReceitanetBX.
            - paragraph [ref=f2e389]: 4. Restrições impostas por alguns provedores de acesso.
            - paragraph [ref=f2e390]:
              - generic [ref=f2e391]: 17 - O que fazer pois estou com dificuldades na comunicação através de provedores de acesso?
            - paragraph [ref=f2e392]: "R: Alguns provedores de acesso (ex. IG) exigem que o usuário informe endereço de e-mail e senha antes de acessar qualquer site. Isto é exigido através de redirecionamento feito quando do acesso a qualquer site via navegador. Tal fato, impacta na comunicação do ReceitanetBX com os servidores da RFB."
            - paragraph [ref=f2e393]: "Aqueles que tiverem dificuldades como descrito acima, deverão, antes de tentar transmitir declarações via ReceitanetBX:"
            - paragraph [ref=f2e394]: 1. Executar seu navegador (Netscape ou Internet Explorer).
            - paragraph [ref=f2e395]: 2. Acessar qualquer site na internet (ex. www.receita.fazenda.gov.br).
            - paragraph [ref=f2e396]: 3. Realizar login (informar endereço de e-mail e senha cadastrados junto ao provedor) com sucesso junto ao provedor de acesso.
            - paragraph [ref=f2e397]: 4. Executar o programa ReceitanetBX.
            - paragraph [ref=f2e398]: Lembramos, por fim, que estes passos são necessários devido a restrições na forma de acesso inicial imposta por alguns provedores de acesso.
