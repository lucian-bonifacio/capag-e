            - heading [level=1] [ref=f2e206]
            - paragraph [ref=f2e207]:
              - generic [ref=f2e208]: 1 - O que é o ReceitanetBX?
            - paragraph [ref=f2e209]: "R: ReceitanetBX é um sistema capaz de transmitir arquivos da base da Secretaria da Receita Federal do Brasil para contribuintes, representantes legais de empresas, procuradores autorizados por procuração eletrônica, servidores da Receita Federal ou entidades conveniadas."
            - paragraph [ref=f2e210]:
              - generic [ref=f2e211]: 2 - Quais os benefícios do serviço ReceitanetBX?
            - paragraph [ref=f2e212]: "R: O serviço ReceitanetBX proporciona segurança, facilidade e praticidade de uso, além da redução dos custos, e atendimento mais eficiente, com recebimento de arquivos diretamente da Base de Dados da RFB."
            - paragraph [ref=f2e213]:
              - generic [ref=f2e214]: 3 -
              - link "Como obtenho o ReceitanetBX?" [ref=f2e215] [cursor=pointer]:
                - /url: https://www.gov.br/receitafederal/pt-br/centrais-de-conteudo/download/receitanetbx/receitanetbx
            - paragraph [ref=f2e216]:
              - generic [ref=f2e217]: 4 - O que pode ser baixado com o ReceitanetBX?
            - paragraph [ref=f2e218]: "R: A versão atual do ReceitanetBX permite baixar arquivos dos seguintes sistemas:"
            - paragraph [ref=f2e219]: Escrituração Contábil Digital (SPED-ECD)
            - paragraph [ref=f2e220]: Escrituração Fiscal Digital (SPED-EFD) e das Notas Fiscais Eletrônicas
            - paragraph [ref=f2e221]: Escrituração Fiscal Digital das Contribuições (SPED - Contribuições)
            - paragraph [ref=f2e222]: Controle Fiscal Contábil de Transição (SPED - FCont)
            - paragraph [ref=f2e223]:
              - generic [ref=f2e224]: 5 - Quais os requisitos para Utilização do ReceitanetBX?
            - paragraph [ref=f2e225]: "R: Para utilização do ReceitanetBX é necessário:"
            - paragraph [ref=f2e226]: 1. Software ReceitanetBX - Verifique se você está com a última versão do ReceitanetBX disponível na página da RFB.
            - paragraph [ref=f2e227]: 2. Acesso a Internet - Através do seu computador você deverá ser capaz de acessar a Internet. Isto pode ser feito através de modems ou através de redes locais da sua empresa ou instituição desde que esta esteja conectada à Internet.
            - paragraph [ref=f2e228]:
              - generic [ref=f2e229]: 6 - Qual a relação entre o ReceitanetBX e os provedores de acesso?
            - paragraph [ref=f2e230]: "R: O programa ReceitanetBX realiza automaticamente a localização dos servidores da RFB ao estabelecer conexão."
            - paragraph [ref=f2e231]: O provedor de acesso que o contribuinte, por ventura, utilize para se conectar a Internet fornece apenas o meio físico para comunicar com os servidores da RFB.
            - paragraph [ref=f2e232]:
              - generic [ref=f2e233]: 7 - Em que horário o Serviço ReceitanetBX está disponível?
            - paragraph [ref=f2e234]: "R: O serviço ReceitanetBX está disponível durante 24 horas por dia."
            - paragraph [ref=f2e235]:
              - generic [ref=f2e236]: 8 - Qual a Configuração mínima para executar o programa ReceitanetBX?
            - paragraph [ref=f2e237]: "R: A configuração mínima é:"
            - paragraph [ref=f2e238]: a) Microcomputador PC ou compatível, processador 1 GHz ou superior;
            - paragraph [ref=f2e239]: b) 512 MB de memória RAM;
            - paragraph [ref=f2e240]: c) Espaço disponível em disco de 100 MB;
            - paragraph [ref=f2e241]: d) Sistema operacional Windows 2000 ou superior;
            - paragraph [ref=f2e242]: e) Máquina Virtual Java Sun JRE 1.6 32 bits, 1.6 64 bits update 38 ou outra superior;
            - paragraph [ref=f2e243]: f) Navegador de Internet (Browser);
            - paragraph [ref=f2e244]: g) Resolução de tela de pelo menos 1024x768;
            - paragraph [ref=f2e245]: h) Mouse.
            - paragraph [ref=f2e246]:
              - generic [ref=f2e247]: 9 - Quais as plataformas suportadas para utilização de Certificados Digitais no ReceitanetBX?
            - paragraph [ref=f2e248]:
              - text: "R: A utilização de certificados digitais para acessar o ReceitanetBX somente funcionará corretamente caso esteja instalada em seu computador a Máquina Virtual Java© da Sun Microsystems (1.6 32 bits, 1.6 64 bits update 38 ou outra superior), que é um programa que pode ser obtido na página"
              - link "http://www.java.com/pt_BR/" [ref=f2e249] [cursor=pointer]:
                - /url: http://www.java.com/pt_BR/
              - text: .
            - paragraph [ref=f2e250]:
              - generic [ref=f2e251]: 10 - O que fazer pois nenhum certificado é listado ao iniciar o sistema?
            - paragraph [ref=f2e252]: "R: Verificar se o ReceitanetBX está sendo executado com a máquina virtual Java da Sun Microsystems versão 1.6 32 bits, 1.6 64 bits update 38 ou outra superior."
            - paragraph [ref=f2e253]:
              - generic [ref=f2e254]: 11 - O que fazer pois não consegui instalar o programa ReceitanetBX?
            - paragraph [ref=f2e255]: "R: Se não foi possível instalar o programa ReceitanetBX verifique se:"
            - paragraph [ref=f2e256]: 1. seu computador utiliza o sistema operacional Windows 2000 ou superior;
            - paragraph [ref=f2e257]: 2. o programa de instalação do ReceitanetBX obtido é a última versão disponível na página da RFB;
            - paragraph [ref=f2e258]: 3. há espaço em disco rígido suficiente no computador;
            - paragraph [ref=f2e259]: 4. o disco rígido não está com problemas de arquivos sobrepostos e referências perdidas;
            - paragraph [ref=f2e260]: 5. a instalação do Windows não está com problemas;
            - paragraph [ref=f2e261]: 6. o computador foi reinicializado após a instalação do ReceitanetBX
            - paragraph [ref=f2e262]:
              - generic [ref=f2e263]: 12 - O que fazer pois não consegui executar o programa ReceitanetBX?
            - paragraph [ref=f2e264]: "R: O ReceitanetBX poderá exibir mensagem indicando que a cópia está danificada. Isto normalmente se deve a:"
            - paragraph [ref=f2e265]: 1. haver setores sobrepostos no seu disco. Neste caso os arquivos usados pelo ReceitanetBX ficaram inconsistentes após a instalação. Utilize o Scandisk ou ChkDsk para detectar e, se possível, corrigir este tipo de problema;
            - paragraph [ref=f2e266]: 2. seu computador estar contaminado com algum tipo de vírus, especialmente aqueles que alteram o conteúdo de arquivos. Utilize sempre programas anti-vírus para detectar possível contaminação, bem como, evitá-las. Mantenha a lista de vírus que seu programa trata sempre atualizada.
            - paragraph [ref=f2e267]:
              - generic [ref=f2e268]: 13 - O que fazer pois a mensagem do ReceitanetBX informa que a versão do programa utilizada está danificada e devo reinstalá-la?
            - paragraph [ref=f2e269]: "R: O ReceitanetBX poderá exibir mensagem indicando que a cópia está danificada. Isto normalmente se deve a:"
            - paragraph [ref=f2e270]: 1. haver setores sobrepostos no seu disco. Neste caso os arquivos usados pelo ReceitanetBX ficaram inconsistentes após a instalação. Utilize o Scandisk ou ChkDsk para detectar e, se possível, corrigir este tipo de problema;
            - paragraph [ref=f2e271]: 2. seu computador está contaminado com algum tipo de vírus, especialmente aqueles que alteram o conteúdo de arquivos. Utilize sempre programas anti-vírus para detectar possível contaminação, bem como, evitá-las. Mantenha a lista de vírus que seu programa trata sempre atualizada.
            - paragraph [ref=f2e272]:
              - generic [ref=f2e273]: 14 - Qual a configuração do proxy e firewall para comunicação pelo ReceitanetBX?
            - paragraph [ref=f2e274]: "R: O esquema de troca de pacotes utilizados pelo novo módulo agregado à aplicação está mostrado abaixo, para que os administradores de segurança das Intranets possam configurar seus ambientes, se assim o desejarem, visando a liberação dos referidos pacotes e consequentemente o funcionamento da aplicação."
