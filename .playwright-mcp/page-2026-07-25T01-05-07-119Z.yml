    - main [ref=f61e97]:
      - generic [ref=f61e99]:
        - heading "Escrituração Contábil Fiscal - ECF" [level=1] [ref=f61e100]
        - paragraph [ref=f61e101]:
          - text: A Escrituração Contábil Fiscal - ECF é um módulo do Sistema Público de Escrituração Digital - Sped, regulamentado por meio da
          - link "Instrução Normativa nº 2004, de 18 de janeiro de 2021" [ref=f61e102] [cursor=pointer]:
            - /url: https://normasinternet2.receita.fazenda.gov.br/#/consulta/externa/114966
          - text: ", onde são apresentadas informações fiscais e operacionais das empresas, que subsidiam a apuração do Imposto de Renda da Pessoa Jurídica - IRPJ e a Contribuição Social sobre o Lucro Líquido - CSLL."
        - paragraph [ref=f61e103]: A escrituração atualizou o formato de preenchimento das fichas de informações econômicas e de informações gerais dos obrigados, e permitiu que empresas obrigadas a entrega da Escrituração Contábil Digital - ECD utilizassem os saldos e contas desse documento fiscal para o preenchimento inicial da ECF. Além disso, desde o ano-calendário 2015 é possível recuperar os saldos finais da ECF anterior, para serem registrados na versão atual da escrituração eletrônica.
        - paragraph [ref=f61e104]:
          - text: Em alinhamento às disposições que regem a escrituração fiscal, o
          - link "Decreto nº 9.580, de 22 de novembro de 2018" [ref=f61e105] [cursor=pointer]:
            - /url: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/decreto/d9580.htm
          - text: e a
          - link "Lei nº 12.973, de 13 de maio de 2014" [ref=f61e106] [cursor=pointer]:
            - /url: https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2014/lei/l12973.htm
          - text: determinam que a pessoa jurídica sujeita à tributação com base no lucro real deve manter escrituração em observância às leis comerciais e fiscais, a ser entregue em meio digital por meio do Sped. Nesse sentido, a
          - link "Instrução Normativa RFB nº 1.700, de 14 de março de 2017" [ref=f61e107] [cursor=pointer]:
            - /url: https://normasinternet2.receita.fazenda.gov.br/#/consulta/externa/81268
          - text: indicou que a ECF pode ser utilizada para preenchimento e o controle, por meio de validações, das partes A e B do Livro Eletrônico de Apuração do Lucro Real - e-Lalur e do Livro Eletrônico de Apuração da Base de Cálculo da CSLL - e-Lacs. Todos os saldos informados nesses livros também são controlados e, no caso da parte B, efetua-se o batimento de saldos de um ano para outro.
