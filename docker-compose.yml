name: capag

services:
  postgres:
    image: postgres:16
    container_name: capag_postgres
    environment:
      POSTGRES_DB: capag
      POSTGRES_USER: capag
      POSTGRES_PASSWORD: capag_local_password
    ports:
      - "5432:5432"
    volumes:
      - capag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capag -d capag"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.12-slim
    container_name: capag_backend
    working_dir: /workspace/backend
    environment:
      CAPAG_DATABASE_URL: postgresql+psycopg://capag:capag_local_password@postgres:5432/capag
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace/backend
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "rm -rf /tmp/capag-backend-deps
      && python -c \"import tomllib; data = tomllib.load(open('pyproject.toml', 'rb')); print(chr(10).join(data['project']['dependencies']))\" > /tmp/capag-backend-requirements.txt
      && python -m pip install --disable-pip-version-check --root-user-action=ignore --target /tmp/capag-backend-deps -r /tmp/capag-backend-requirements.txt
      && PYTHONPATH=/workspace/backend:/tmp/capag-backend-deps python -m alembic -c alembic.ini upgrade head
      && PYTHONPATH=/workspace/backend:/tmp/capag-backend-deps python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/backend/app"

  backend-tests:
    image: python:3.12-slim
    profiles:
      - test
    working_dir: /workspace/backend
    volumes:
      - .:/workspace
    command: >
      sh -c "rm -rf /tmp/capag-backend
      && cp -R /workspace/backend /tmp/capag-backend
      && cd /tmp/capag-backend
      && python -m pip install --disable-pip-version-check --root-user-action=ignore -e '.[test]'
      && python -m pytest"

  frontend:
    image: node:20-alpine
    container_name: capag_frontend
    working_dir: /workspace/frontend
    ports:
      - "5173:5173"
    volumes:
      - capag_frontend_workspace:/workspace/frontend
      - ./frontend/e2e:/workspace/frontend/e2e
      - ./frontend/src:/workspace/frontend/src
      - ./frontend/index.html:/workspace/frontend/index.html
      - ./frontend/package.json:/workspace/frontend/package.json
      - ./frontend/playwright.config.ts:/workspace/frontend/playwright.config.ts
      - ./frontend/postcss.config.js:/workspace/frontend/postcss.config.js
      - ./frontend/tailwind.config.ts:/workspace/frontend/tailwind.config.ts
      - ./frontend/tsconfig.json:/workspace/frontend/tsconfig.json
      - ./frontend/vite.config.ts:/workspace/frontend/vite.config.ts
      - ./frontend/vitest.config.ts:/workspace/frontend/vitest.config.ts
    command: >
      sh -c "npm install --no-package-lock --audit=false --fund=false
      && npm run dev"

  frontend-tests:
    image: node:20-alpine
    profiles:
      - test
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    command: >
      sh -c "rm -rf /tmp/capag-frontend
      && cp -R /workspace/frontend /tmp/capag-frontend
      && cd /tmp/capag-frontend
      && npm install --no-package-lock --audit=false --fund=false
      && npm run test
      && npm run build"

  frontend-e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    profiles:
      - test
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    command: >
      sh -c "rm -rf /tmp/capag-frontend
      && cp -R /workspace/frontend /tmp/capag-frontend
      && cd /tmp/capag-frontend
      && npm install --no-package-lock --audit=false --fund=false
      && npm run test:e2e"

volumes:
  capag_postgres_data:
  capag_frontend_workspace:
